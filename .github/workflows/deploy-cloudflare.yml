name: Deploy Cloudflare

# 生产默认由 Cloudflare Workers Builds（Connect to Git）在 push main 时部署。
# 本 workflow 仅保留手动入口（应急 / CF Builds 不可用时），不再在 push 时自动 deploy。
# 业务密钥仍只放在 Cloudflare Secrets，不写进 GitHub。
on:
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (Cloudflare / Workers)
        run: pnpm build
        env:
          CHENGZHANG_RUNTIME: cloudflare

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
