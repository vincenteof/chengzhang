name: Deploy homelab

# Quality gates stay on GitHub-hosted runners (ci.yml).
# This job runs on a machine in your LAN: no inbound ports required.
on:
  workflow_dispatch:
  # Enable after the homelab runner is online, or jobs sit on "Waiting for a runner":
  # push:
  #   branches: [main]

concurrency:
  group: deploy-homelab
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Update checkout
        env:
          DEPLOY_DIR: ${{ vars.CHENGZHANG_DEPLOY_DIR || '/opt/chengzhang' }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            echo "Clone this repo to $DEPLOY_DIR on the runner host, then retry."
            echo "  git clone git@github.com:${GITHUB_REPOSITORY}.git $DEPLOY_DIR"
            exit 1
          fi
          if [ ! -f "$DEPLOY_DIR/.env" ]; then
            echo "Create $DEPLOY_DIR/.env from .env.example on the runner host."
            exit 1
          fi
          git -C "$DEPLOY_DIR" fetch --prune origin
          git -C "$DEPLOY_DIR" checkout --force --detach "$SHA"
          git -C "$DEPLOY_DIR" clean -fd --exclude .env --exclude .env.local

      - name: Compose up
        env:
          DEPLOY_DIR: ${{ vars.CHENGZHANG_DEPLOY_DIR || '/opt/chengzhang' }}
        run: bash "$DEPLOY_DIR/scripts/homelab-deploy.sh"
