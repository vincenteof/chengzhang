name: chengzhang

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chengzhang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chengzhang}
      POSTGRES_DB: chengzhang
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chengzhang -d chengzhang']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - '${PORT:-3000}:3000'
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      NODE_ENV: production
      MEDIA_DIR: /data/media
      DATABASE_URL: postgresql://chengzhang:${POSTGRES_PASSWORD:-chengzhang}@postgres:5432/chengzhang
    env_file:
      - .env
    volumes:
      - media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
